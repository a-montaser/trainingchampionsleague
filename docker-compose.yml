# Local Postgres for development. Production uses Neon; both speak the same
# protocol, so only DATABASE_URL differs.
#
#   docker compose up -d
#   npm run db:migrate
services:
  db:
    image: postgres:17-alpine
    container_name: tcl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tcl
    ports:
      - '5432:5432'
    volumes:
      - tcl-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d tcl']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tcl-pgdata:
